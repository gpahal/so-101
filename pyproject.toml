[project]
name = "so-101"
version = "0.1.0"
description = "SO-101 leader and follower arms with LeRobot"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Garvit Pahal", email = "g10pahal@gmail.com" }
]
requires-python = ">=3.13,<3.14"
dependencies = [
    "lerobot[core-scripts,feetech,remote,training]>=0.7.0",
    "pyobjc-framework-avfoundation>=13.0 ; sys_platform == 'darwin'",
]

[project.optional-dependencies]
# The simulator: `uv sync --extra sim`. Pinned, because a MuJoCo release can change the model the sim builds and so its scores.
sim = ["mujoco==4.0.1", "scipy"]

[project.scripts]
so101 = "so_101.cli:main"
so101-control = "so_101.control.main:main"
so101-teleoperate = "so_101.connect:teleoperate"
so101-record = "so_101.connect:record"
so101-replay = "so_101.connect:replay"
so101-calibrate = "so_101.connect:calibrate"
so101-failbench = "so_101.failbench.cli:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
failbench = [
    "google-genai>=3.5",
    "openai>=3.54",
    "typesafe-sdk>=0.7.5",
]
