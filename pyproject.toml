[project]
name = "so-101"
version = "0.1.0"
description = "SO-101 leader and follower arms with LeRobot"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Garvit Pahal", email = "g10pahal@gmail.com" }
]
requires-python = ">=3.13,<3.14"
dependencies = [
    "lerobot[core-scripts,feetech,remote,training]>=0.7.0",
    "pyobjc-framework-avfoundation>=13.0 ; sys_platform == 'darwin'",
]

[project.optional-dependencies]
# The simulator: `uv sync --extra sim`. Pinned because LeRobot's SO-101 env is built on this version.
sim = ["mujoco==3.3.7", "scipy"]

[project.scripts]
so101 = "so_101.cli:main"
so101-rollout = "so_101.rollout:main"
so101-control = "so_101.control.main:main"
so101-teleoperate = "so_101.connect:teleoperate"
so101-record = "so_101.connect:record"
so101-replay = "so_101.connect:replay"
so101-calibrate = "so_101.connect:calibrate"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
