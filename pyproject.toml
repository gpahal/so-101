[project]
name = "so-101"
version = "0.1.0"
description = "SO-101 leader and follower arms with LeRobot"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Garvit Pahal", email = "g10pahal@gmail.com" }
]
requires-python = ">=3.13,<3.14"
dependencies = [
    "lerobot[core-scripts,feetech,remote,training]>=0.7.0",
    "pyobjc-framework-avfoundation>=13.0 ; sys_platform == 'darwin'",
]

[project.scripts]
so101 = "so_101.cli:main"
so101-rollout = "so_101.rollout:main"
so101-control = "so_101.control.main:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
