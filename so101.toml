# SO-101 hardware settings. Every `uv run so101 ...` command and the Python helpers read this file.
#
# Ports can change when a board is replugged or moved to another USB socket.
# `uv run so101 find-port <arm>` detects the board and rewrites `port` and `serial_number` here.
# If a saved port is gone, commands look the board up by `serial_number` instead.
#
# Environment variables override this file: SO101_FOLLOWER_PORT, SO101_LEADER_PORT,
# SO101_FOLLOWER_ID, SO101_LEADER_ID. `uv run so101 env` prints them all.

# Calibration files, relative to this file. Each arm's lands in <calibration_dir>/<arm>/<id>.json.
calibration_dir = "calibration"

[follower]
id = "so101_follower"
port = "/dev/cu.usbmodem5C821078261"
serial_number = "5C82107826"

[leader]
id = "so101_leader"
port = "/dev/cu.usbmodem5C821094141"
serial_number = "5C82109414"

[teleop]
fps = 60
# Max degrees any follower joint may move per control step. Smooths sudden jumps.
# Set to 0 to turn the limit off.
max_relative_target = 10

# Cameras. Commands find each camera by its USB vendor:product id (`usb_id`), so it doesn't matter
# which socket it's in or what else is plugged in (on macOS). `index` is the OpenCV device index,
# used only for a camera without a usb_id or when two cameras share one; `uv run so101 cameras`
# lists what's connected. rotation is 0, 90, 180 or -90.
# Environment variables force an index: SO101_CAMERA_FRONT_INDEX, SO101_CAMERA_WRIST_INDEX.
#
# [cameras.<name>.controls] is optional. Before any command opens the cameras, `so101` sets each
# listed UVC control with uvc-util (install it with scripts/install-uvc-util.sh) and checks it
# stuck. `uvc-util -V <usb_id> -S '*'` lists a camera's controls and their ranges.
# exposure-time-abs is in units of 0.1 ms.

# Fixed camera looking at the workspace.
[cameras.front]
index = 0
width = 640
height = 480
fps = 30
rotation = 0
usb_id = "32e6:9221"

[cameras.front.controls]
# Anti-flicker for 50 Hz mains (India). 0 = off, 1 = 50 Hz, 2 = 60 Hz.
power-line-frequency = 1
# Fixed 20 ms exposure: a whole number of the lights' 10 ms flicker cycles, so no banding. Auto
# exposure blows out the walls and bowl; shorter exposures (2.5, 5 ms) band and go dark. Picked from a
# sweep of exposure, gamma, contrast and saturation: 20 ms with gamma 80 is bright with nothing clipped.
# Fixed exposure doesn't adapt to light: if the room gets much brighter, try 10 ms with gamma 100.
auto-exposure-mode = 1
exposure-time-abs = 200
gamma = 80
# The camera's defaults, listed so applying this config also undoes any other values left set.
# white-balance-temp is left out: this camera accepts it but the picture doesn't change.
brightness = 0
contrast = 32
saturation = 57

# Camera on the gripper.
[cameras.wrist]
index = 1
width = 640
height = 480
fps = 30
rotation = 0
usb_id = "32e6:9005"

[cameras.wrist.controls]
# This camera ignores power-line-frequency, so tube lights on 50 Hz mains put rolling bands in
# its picture. A fixed exposure of a whole number of flicker cycles avoids them (auto measured 5.3%
# flicker), but this camera's exposure units run about 12% off: a sweep found the band-free values
# at 114, about 228 and 285, while 200 (nominally 20 ms) measured 2.7%. Retune from those values.
# Fixed exposure doesn't adapt to light: if images get too dark or bright, adjust gamma first.
# Tuned for the wooden table: the shortest band-free exposure leaves highlights headroom, so the
# gripper and reflections don't glare, and gamma 130 brightens the mid-tones instead.
auto-exposure-mode = 1
exposure-time-abs = 114
gamma = 130
brightness = -10
saturation = 25
# The camera's default, listed so applying this config also undoes any other value left set.
contrast = 27

# Where `so101 record` saves demos: <dir>/<task>/sessions/, plus edits and the training dataset.
# Relative to this file; git-ignored. Back it up with `uv run so101 backup <task>`.
# The environment variable SO101_DATA_DIR overrides it.
[data]
dir = "data"

# `uv run so101 run <task>`: run a pretrained policy from tasks.toml on the follower.
[run]
# Seconds before the run stops and the arm returns to its starting pose. 0 runs until Ctrl+C.
duration_s = 60
# Torch device for the policy: "mps" (Apple GPU), "cpu" or "cuda".
device = "mps"
# Max degrees a joint may move per control step while a policy drives the arm. Lower than
# teleop's, because a policy trained on someone else's arm can command sudden jumps. 0 turns it off.
max_relative_target = 5

# `uv run so101 train <task>`: train ACT on a task you recorded with `so101 record`.
[train]
# Hugging Face Jobs hardware the run is sent to; `uv run hf jobs hardware` lists flavors and prices.
# "local" trains on this Mac instead (many hours for ACT). Remote runs need `uv run hf auth login`
# and credit on your Hugging Face account.
job_target = "a100-large"
# Stops the job and its billing if it runs longer than this.
job_timeout = "3h"
# ACT's docs put 100k steps at batch 64 at about 1.5 h on an A100, so this is roughly 30 minutes.
steps = 30000
batch_size = 64
