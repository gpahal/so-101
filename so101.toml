# SO-101 hardware settings. Every `uv run so101 ...` command and the Python helpers read this file.
#
# Ports can change when a board is replugged or moved to another USB socket.
# `uv run so101 find-port <arm>` detects the board and rewrites `port` and `serial_number` here.
# If a saved port is gone, commands look the board up by `serial_number` instead.
#
# Environment variables override this file: SO101_FOLLOWER_PORT, SO101_LEADER_PORT,
# SO101_FOLLOWER_ID, SO101_LEADER_ID. `uv run so101 env` prints them all.
# SO101_CONFIG points every command at a different settings file.

# Calibration files, relative to this file. Each arm's lands in <calibration_dir>/<arm>/<id>.json.
calibration_dir = "calibration"

[follower]
id = "so101_follower"
port = "/dev/cu.usbmodem5C821078261"
serial_number = "5C82107826"

[leader]
id = "so101_leader"
port = "/dev/cu.usbmodem5C821094141"
serial_number = "5C82109414"

[teleop]
fps = 60
# Max a follower joint may move per control step, while teleoperating and recording: degrees, or
# percent of its range for the gripper. Smooths sudden jumps. Set to 0 to turn the limit off.
max_relative_target = 10

# Cameras. Commands find each camera by its USB vendor:product id (`usb_id`), so it doesn't matter
# which socket it's in or what else is plugged in (on macOS). `index` is the OpenCV device index,
# used only for a camera without a usb_id or when two cameras share one; `uv run so101 cameras`
# lists what's connected. rotation is 0, 90, 180 or -90.
# Environment variables force an index: SO101_CAMERA_FRONT_INDEX, SO101_CAMERA_WRIST_INDEX.
#
# [cameras.<name>.controls] is optional. Before any command opens the cameras, `so101` sets each
# listed UVC control with uvc-util (install it with scripts/install-uvc-util.sh) and checks it
# stuck. They stay set until the camera loses power. `uvc-util -V 0x32e6:0x9005 -S '*'` lists a
# camera's controls and their ranges (that's the wrist camera's usb_id, with 0x before each part).
# exposure-time-abs is nominally in units of 0.1 ms; the wrist camera's run off (see below).

# Fixed camera looking at the workspace.
[cameras.front]
index = 0
width = 640
height = 480
fps = 30
rotation = 0
usb_id = "32e6:9221"

[cameras.front.controls]
# Anti-flicker for 50 Hz mains (India). 0 = off, 1 = 50 Hz, 2 = 60 Hz.
power-line-frequency = 1
# Fixed 20 ms exposure: a whole number of the lights' 10 ms flicker cycles, so no banding. Auto
# exposure blows out the walls and bowl; shorter exposures (2.5, 5 ms) band and go dark. Picked from a
# sweep of exposure, gamma, contrast and saturation: 20 ms with gamma 80 is bright with nothing clipped.
# Fixed exposure doesn't adapt to light: if the room gets much brighter, try 10 ms with gamma 100.
auto-exposure-mode = 1
exposure-time-abs = 200
gamma = 80
# The camera's defaults, listed so applying this config also undoes any other values left set.
# white-balance-temp is left out: this camera accepts it but the picture doesn't change.
brightness = 0
contrast = 32
saturation = 57

# Camera on the gripper.
[cameras.wrist]
index = 1
width = 640
height = 480
fps = 30
rotation = 0
usb_id = "32e6:9005"

[cameras.wrist.controls]
# This camera ignores power-line-frequency, so tube lights on 50 Hz mains put rolling bands in
# its picture. A fixed exposure of a whole number of flicker cycles avoids them (auto measured 5.3%
# flicker), but this camera's exposure units run about 12% off: a sweep found the band-free values
# at 114, about 228 and 285, while 200 (nominally 20 ms) measured 2.7%. Retune from those values.
# A longer exposure slows the camera (40 ms: 14 fps).
# Fixed exposure doesn't adapt to light: if images get too dark or bright, adjust gamma first.
# Tuned for the wooden table: the shortest band-free exposure leaves highlight headroom, so red
# maxed out in at most 11% of pixels just before a grasp, against 31-63% at 200. Gamma 130 with
# brightness -10 sets the mid-tones. Reflections off the table still clip in a small stripe.
# White balance isn't set here, and the picture can shift: it turned pink around the release in
# 5 of 60 demos.
auto-exposure-mode = 1
exposure-time-abs = 114
gamma = 130
brightness = -10
# The camera's defaults, listed so applying this config also undoes any other values left set.
saturation = 25
contrast = 27

# Where `so101 record` saves demos: <dir>/<task>/sessions/, plus edits and the training dataset.
# Relative to this file; git-ignored. Back it up with `uv run so101 backup <task>`.
# The environment variable SO101_DATA_DIR overrides it.
[data]
dir = "data"

# `uv run so101 run <task>`: run a task's policy from tasks.toml on the follower.
[run]
# Seconds before the run stops and the arm returns to its starting pose. 0 runs until Ctrl+C.
duration_s = 60
# Torch device for the policy, here and when training locally: "mps" (Apple GPU), "cpu" or "cuda".
device = "mps"
# Max a joint may move per control step while a policy drives the arm, in teleop's units. Lower than
# teleop's, because a policy can command sudden jumps, especially one trained on someone else's arm.
# 0 turns it off.
max_relative_target = 5

# `uv run so101 train <task> [--policy act|pi05]`: train a policy on a task you recorded.
# job_target is the Hugging Face Jobs hardware, and `uv run hf jobs hardware` lists flavors and
# prices. Remote runs need `uv run hf auth login` and credit on your Hugging Face account. `--target
# local` trains on this Mac instead, for ACT only, and takes days at these settings.
# The job's timeout stops it and its billing, and a job that hits it loses work since its last
# checkpoint. It's 2.5x the expected time, worked out from the steps and seconds_per_step, plus 10
# minutes of start-up, rounded up to whole hours. Add a flavor's measured speed to use it.
# steps_per_demo sets the steps from the demos kept after edits, so each demo is seen as often when
# you add more. checkpoints sets how many get saved, whatever the length of the run.
# Speeds measured in November 2026 on 50 demos (17,970 frames). They don't depend on the number of demos.

[train.act]
# 100k steps and about 1.5 hours and $4 at 50 demos; 200k and about 3 hours and $8 at 100. An A100
# takes 1.4x as long (about 2 hours and $5 at 50 demos) and an A10G 3.3x (4.5 hours and $5-7). ACT's
# error on unseen demos levels off early, so this length is cheap insurance rather than a known need.
# Its learning rate is constant, so you can test the checkpoints along the way as well as the final one.
job_target = "rtx-pro-6000"
steps_per_demo = 2000
batch_size = 8
num_workers = 12
checkpoints = 5

[train.act.seconds_per_step]
rtx-pro-6000 = 0.05
a100-large = 0.071

[train.pi05]
# 6k steps and about 5 hours and $14 at 50 demos; 12k and about 10 hours and $27 at 100. An A100
# takes 1.6x as long (about 8 hours and $19 at 50 demos), and an A10G can't fit this batch size.
# 6k steps scored 27/40 at 50 demos in the recipe's source; longer runs haven't been tested on a robot.
# Needs access to google/paligemma-3b-pt-224 on Hugging Face.
job_target = "rtx-pro-6000"
steps_per_demo = 120
batch_size = 32
num_workers = 12
checkpoints = 2

[train.pi05.seconds_per_step]
rtx-pro-6000 = 2.9
a100-large = 4.6
