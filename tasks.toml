# Tasks you record demos for and train a policy on, one SO-101 with two cameras.
#
# Demos are saved under data/<task>/ (see [data] in so101.toml), in degrees, uploaded for training
# to <your Hub user>/so101_<task>, and the trained policy goes to <your Hub user>/act_so101_<task>
# (or pi05_so101_<task>), all private.
#   uv run so101 record --dry-run   rehearse and check everything first
#   uv run so101 record    teleoperate demos, as a new session, until there are `episodes`
#   uv run so101 review    trim idle time and delete bad demos
#   uv run so101 train     build the training dataset and train ACT or (--policy pi05) pi0.5, on Hugging Face Jobs by default
#   uv run so101 run       run the trained policy
#   uv run so101 serve     supervise the trained policy and record corrections (see the README)
# Each command works on `default` below; add a task name to use another, e.g. `so101 record <task>`.
#
# Fields:
#   prompt          The task text saved with each demo and given to the policy (required). ACT ignores it.
#   fps             Control rate to record and run at (default 30).
#   episodes        Demos to keep (default 100). ~100 for one pick-and-place, spread over 5+ start positions.
#   episode_time_s  Seconds per demo (default 20); press Right arrow or n to finish one early.
#   reset_time_s    Seconds between demos to put the props back (default 10).
#   cameras         Your cameras to record, named as in so101.toml (default: ["top", "wrist"]).
#   props, setup    What to put on the table and where the cameras go.
# Copy a task's section and change the name, prompt and props to add another task.

# The task every `so101` command uses when you don't name one.
default = "block-container"

[block-container]
prompt = "Pick up the red block and put it in the cylindrical container"
episodes = 100
episode_time_s = 30
reset_time_s = 15
props = [
  "Red toy brick (2x2), lying flat",
  "Clear cylindrical container with an amber tint, open side up",
  "Matte black mat under the workspace",
]
setup = [
  "Top camera above the mat, fixed: don't move it between recording and running",
  "Container stays in one spot, within easy reach and off the wall; record 12 demos at each of 5 spots and keep the best 10, then go round the spots again (100 kept)",
  "Start every demo from the same folded rest pose, and do the task the same way each time",
  "The policy learns the props' colours and the surface: if you change one, record new demos with it",
]
